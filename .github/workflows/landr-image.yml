# LANDR fork: the Moto server image (linux/amd64 + linux/arm64) on a tag such as 5.2.3-landr.1 or
# 5.2.3-landr.1-rc.1, pushed to ghcr.io/landraudio/emulation-moto:<tag> (not rebuilt if that image tag
# exists). The digest goes to the job summary: it is the reference the emulated kit pins
# (compose.kit.yml x-moto-image).
name: LANDR image

on:
  push:
    tags: ["*-landr.*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/landraudio/emulation-moto

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A tag whose image is already in the registry is not built again: a release tag on the commit of a
      # release candidate gets the candidate's image by digest (imagetools create), with no rebuild
      - id: existing
        name: Already published?
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if manifest=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' 2>/dev/null); then
            echo "digest=$(jq -r .digest <<<"$manifest")" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${TAG} already exists: not rebuilt"
          fi
      - id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.landr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.existing.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### ${IMAGE}:${TAG}"
            echo
            echo "Pin (compose.kit.yml \`x-moto-image\`):"
            echo
            echo "\`${IMAGE}:${TAG}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
