# LANDR fork: lint and the tests of the services the landr/* commits touch.
# Upstream's workflows are dropped on landr/* branches (their matrix and publishing are getmoto's).
name: LANDR tests

on:
  push:
    branches: ["landr/**"]
  pull_request:
    branches: ["landr/**"]

permissions:
  contents: read

concurrency:
  group: landr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Moto's tests never reach AWS; fake credentials, no profile.
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
      # mypy and pyparsing pinned for make lint (see landr/constraints-ci.txt)
      PIP_CONSTRAINT: landr/constraints-ci.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: make init
      - name: Lint (ruff, mypy)
        run: make lint
      # As upstream's Makefile (test-only): most suites serially; the big ones with -n 4 --dist loadscope (a
      # module's or class's tests on one worker), MOTO_CALL_RESET_API=false, and the clean-slate tests apart.
      # Several test modules start a ThreadedMotoServer on a fixed port (5001 in test_core and test_s3): spread
      # over workers, the second bind fails in the server thread and start() waits forever.
      - name: Tests of the touched services, serially (no Docker-backed tests)
        run: >-
          pytest -rs -m "not requires_docker"
          tests/test_core tests/test_moto_api tests/test_stepfunctions tests/test_cloudwatch
      - name: Tests of the touched services, in parallel (no Docker-backed tests)
        env:
          MOTO_CALL_RESET_API: "false"
        run: >-
          pytest -n 4 --dist loadscope -rs -m "not requires_docker and not requires_clean_slate"
          tests/test_s3 tests/test_ec2 tests/test_awslambda
      - name: Clean-slate tests of the parallel services
        run: >-
          pytest -rs -m "requires_clean_slate and not requires_docker"
          tests/test_s3 tests/test_ec2 tests/test_awslambda
